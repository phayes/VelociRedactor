[package]
name = "veloci-cli"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for Veloci Redactor: redact secrets and PII from text and structured files"
license = "MIT"
repository = "https://github.com/phayes/velociredactor"
homepage = "https://github.com/phayes/velociredactor"
keywords = ["redaction", "secrets", "pii", "gitleaks", "security"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[features]
default = ["fuse"]
# The `fuse` command: mount a redacted view of a directory (Linux).
fuse = ["dep:fuser", "dep:rustix", "dep:signal-hook", "dep:libc", "dep:unicode-normalization"]
# Run the privacy_filter model on an NVIDIA GPU. Needs the CUDA toolkit.
cuda = ["veloci/privacy-filter-cuda"]
# Use the system OpenBLAS for the privacy_filter model on the CPU (Linux).
openblas = ["veloci/privacy-filter-openblas"]

[dependencies]
veloci = { path = "..", version = "0.3.3", features = ["privacy-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
grep = "0.4"
hf-hub = { version = "1", features = ["blocking"] }
ignore = "0.4"
rayon = "1"
serde_json = "1"
termcolor = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["fs", "process"], optional = true }
signal-hook = { version = "0.3", optional = true }
unicode-normalization = { version = "0.1", optional = true }

# Apple Accelerate is always there on macOS, so the binary uses it.
[target.'cfg(target_os = "macos")'.dependencies]
veloci = { path = "..", version = "0.3.3", features = ["privacy-filter-accelerate"] }

[[bin]]
name = "veloci"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
