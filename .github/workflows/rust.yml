name: Rust

on:
  push:
    branches: [ "master" ]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    name: Release ${{ matrix.target }}
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Build release binary
      run: cargo build --release --locked --package velociredactor-cli --target ${{ matrix.target }}
      env:
        RUSTFLAGS: -C strip=symbols
    - name: Package
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME}"
        target="${{ matrix.target }}"
        exe="velociredactor"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          exe="velociredactor.exe"
        fi

        stage="velociredactor-${version}-${target}"
        mkdir -p "$stage" dist
        cp "target/${target}/release/${exe}" README.md LICENSE "$stage/"

        if [[ "${{ runner.os }}" == "Windows" ]]; then
          7z a "dist/${stage}.zip" "$stage"
          asset="${stage}.zip"
        else
          tar -czf "dist/${stage}.tar.gz" "$stage"
          asset="${stage}.tar.gz"
        fi

        if command -v sha256sum >/dev/null; then
          (cd dist && sha256sum "$asset" > "${asset}.sha256")
        else
          (cd dist && shasum -a 256 "$asset" > "${asset}.sha256")
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: dist/*

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        fail_on_unmatched_files: true
