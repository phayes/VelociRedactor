name: Rust

on:
  push:
    branches: [ "master" ]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    name: Release ${{ matrix.target }}
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Build release binary
      run: cargo build --release --locked --package velociredactor-cli --target ${{ matrix.target }}
      env:
        RUSTFLAGS: -C strip=symbols
    - name: Package
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME}"
        target="${{ matrix.target }}"
        ext=""
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          ext=".exe"
        fi
        exe="velociredactor${ext}"

        stage="velociredactor-${version}-${target}"
        mkdir -p "$stage" dist
        cp "target/${target}/release/${exe}" README.md LICENSE "$stage/"

        if [[ "${{ runner.os }}" == "Windows" ]]; then
          7z a "dist/${stage}.zip" "$stage"
          asset="${stage}.zip"
        else
          tar -czf "dist/${stage}.tar.gz" "$stage"
          asset="${stage}.tar.gz"
        fi

        if command -v sha256sum >/dev/null; then
          (cd dist && sha256sum "$asset" > "${asset}.sha256")
        else
          (cd dist && shasum -a 256 "$asset" > "${asset}.sha256")
        fi

        # The bare binary, named for the plugin's libexec/ directory.
        mkdir -p libexec
        cp "target/${target}/release/${exe}" "libexec/velociredactor-${target}${ext}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: libexec-${{ matrix.target }}
        path: libexec/*

  plugin:
    name: Package Claude Code plugin
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: libexec-*
        path: plugin/libexec
        merge-multiple: true
    - name: Assemble plugin
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"

        # Artifacts lose the executable bit; the launcher's is kept by git.
        chmod +x plugin/bin/velociredactor plugin/libexec/*
        for target in \
          aarch64-apple-darwin x86_64-apple-darwin \
          aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu \
          aarch64-pc-windows-msvc.exe x86_64-pc-windows-msvc.exe; do
          test -f "plugin/libexec/velociredactor-${target}" || { echo "missing velociredactor-${target}" >&2; exit 1; }
        done

        # Claude Code detects updates by plugin.json's version.
        jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin.json.tmp
        mv plugin.json.tmp plugin/.claude-plugin/plugin.json

        plugin/bin/velociredactor --version
    - name: Validate plugin
      run: npx --yes @anthropic-ai/claude-code plugin validate ./plugin
    - name: Package plugin
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        (cd plugin && zip -r -X ../dist/velociredactor-plugin.zip .)
        (cd dist && sha256sum velociredactor-plugin.zip > velociredactor-plugin.zip.sha256)
    - uses: actions/upload-artifact@v4
      with:
        name: plugin
        path: dist/*

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [release, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        name: plugin
        path: dist
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        fail_on_unmatched_files: true
